<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Universal Error Lookup</title>

    </head>
    <body>
        <h1>UNIVERSAL ERROR LOOKUP</h1>
        <form method="POST" action="/">
            <input type="text" name="error_code" placeholder="Enter error code">
            <button type="submit">Lookup</button>
        </form>

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}
        
        {% if result %}
            <h2>Result:</h2>
            <p><b>Error Code:</b> {{ result.error_code }}</p>
            <p><b>Source API:</b> {{ result.source_api }}</p>
            <p><b>Result Summary:</b> {{ result.result_summary }}</p>
            <a href="https://www.google.com/search?q={{ result.error_code }}+error+fix" target="_blank">
                <button type="button">Google Search</button>
            </a>
            <a href="https://www.google.com/search?q=site:reddit.com+{{ result.error_code }}+error+fix" target="_blank">
                <button type="button">Reddit Search</button>
            </a>
            <a href="https://www.google.com/search?q=site:stackoverflow.com+{{ result.error_code }}+error+fix" target="_blank">
                <button type="button">Stack Overflow Search</button>
            </a>
            {% endif %}
    </body>
</html>
